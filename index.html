<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CosmicWallet - Galaxy Finance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Dynamic PWA Manifest -->
    <link id="pwa-manifest" rel="manifest" href="">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 10%, #1a0b36 0%, #05020a 100%);
            color: #f3e8ff;
        }
        .galaxy-bg {
            background: radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%),
                        #05020a;
        }
        .glass-card {
            background: rgba(20, 10, 35, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 8px 32px 0 rgba(5, 2, 10, 0.5);
        }
        .glass-nav {
            background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(168, 85, 247, 0.25);
        }
        .neon-glow-purple {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.5);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.5);
        }
        .neon-glow-pink {
            box-shadow: 0 0 25px -5px rgba(236, 72, 153, 0.5);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .stars {
            background-image: radial-gradient(rgba(255,255,255,0.8) 1px, transparent 0);
            background-size: 35px 35px;
            opacity: 0.2;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 galaxy-bg relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- Starry Background Overlay -->
    <div class="absolute inset-0 stars pointer-events-none z-0"></div>

    <!-- Mobile Shell Container -->
    <div class="w-full sm:max-w-[420px] h-screen sm:h-[860px] bg-[#080312] sm:rounded-[44px] shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-4 sm:border-purple-500/30 z-10">
        
        <!-- Mobile Status Bar Simulation -->
        <div class="flex justify-between items-center px-6 pt-3 pb-2 text-xs font-semibold text-purple-200/70 select-none bg-transparent z-30">
            <span id="current-time">9:41</span>
            <div class="flex items-center space-x-1.5">
                <i data-lucide="signal" class="w-3.5 h-3.5 text-cyan-400"></i>
                <i data-lucide="wifi" class="w-3.5 h-3.5 text-purple-300"></i>
                <i data-lucide="battery" class="w-4 h-4 text-emerald-400"></i>
            </div>
        </div>

        <!-- Root View Area (Auth / Main App) -->
        <div id="root-view" class="flex-1 flex flex-col relative overflow-hidden">
            <!-- Dynamic content injected here -->
        </div>

    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 glass-card text-purple-100 px-5 py-3 rounded-2xl shadow-2xl z-50 text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-3 border border-cyan-500/40">
        <span class="text-cyan-400 text-lg">✨</span>
        <span id="toast-msg">Berhasil!</span>
    </div>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Configuration
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cosmic-wallet-pwa-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForPreviewModeOnly",
            authDomain: "cosmic-wallet.firebaseapp.com",
            projectId: "cosmic-wallet",
            storageBucket: "cosmic-wallet.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Application State
        let currentUser = null;
        let authMode = 'login'; // 'login' or 'signup'
        let currentTab = 'home';
        let txFilter = 'all';
        let currentTxType = 'expense';
        let transactions = [];
        let unsubscribeTx = null;
        let isAuthenticating = false;
        let deferredPwaPrompt = null;

        // Dynamic Manifest setup for PWA
        const manifestData = {
            name: "CosmicWallet - Galaxy Finance",
            short_name: "CosmicWallet",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#080312",
            theme_color: "#1a0b36",
            icons: [
                { src: "https://placehold.co/192x192/1a0b36/06b6d4?text=CW", sizes: "192x192", type: "image/png" },
                { src: "https://placehold.co/512x512/1a0b36/ec4899?text=CW", sizes: "512x512", type: "image/png" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

        // Capture PWA install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPwaPrompt = e;
            showToast('CosmicWallet siap diinstal ke perangkat Anda! 🚀');
        });

        // Global App Actions
        window.appState = {
            setAuthMode(mode) {
                authMode = mode;
                renderRoot();
            },
            switchTab(tab) {
                currentTab = tab;
                renderMainAppContent();
            },
            setTxFilter(filter) {
                txFilter = filter;
                renderMainAppContent();
            },
            setTxType(type) {
                currentTxType = type;
                const expBtn = document.getElementById('type-expense');
                const incBtn = document.getElementById('type-income');
                if (expBtn && incBtn) {
                    if (type === 'expense') {
                        expBtn.className = "py-2.5 rounded-xl font-semibold text-xs transition-all bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg shadow-pink-900/50 text-center cursor-pointer";
                        incBtn.className = "py-2.5 rounded-xl font-semibold text-sm transition-all text-purple-300/60 hover:text-white text-center cursor-pointer";
                    } else {
                        incBtn.className = "py-2.5 rounded-xl font-semibold text-sm transition-all bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-900/50 text-center cursor-pointer";
                        expBtn.className = "py-2.5 rounded-xl font-semibold text-sm transition-all text-purple-300/60 hover:text-white text-center cursor-pointer";
                    }
                }
            },
            openModal() {
                const modal = document.getElementById('add-modal');
                if(modal) {
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                    modal.children[0].classList.remove('translate-y-full');
                }
            },
            closeModal() {
                const modal = document.getElementById('add-modal');
                if(modal) {
                    modal.classList.add('opacity-0', 'pointer-events-none');
                    modal.children[0].classList.add('translate-y-full');
                }
            },
            openPwaModal() {
                const modal = document.getElementById('pwa-modal');
                if(modal) modal.classList.remove('opacity-0', 'pointer-events-none');
            },
            closePwaModal() {
                const modal = document.getElementById('pwa-modal');
                if(modal) modal.classList.add('opacity-0', 'pointer-events-none');
            },
            async triggerPwaInstall() {
                if (deferredPwaPrompt) {
                    deferredPwaPrompt.prompt();
                    const { outcome } = await deferredPwaPrompt.userChoice;
                    if (outcome === 'accepted') {
                        showToast('Terima kasih telah menginstal CosmicWallet! ✨');
                    }
                    deferredPwaPrompt = null;
                } else {
                    window.appState.openPwaModal();
                }
            },
            async handleAuth(e) {
                e.preventDefault();
                if (isAuthenticating) return;
                isAuthenticating = true;

                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-password').value;

                try {
                    if (authMode === 'login') {
                        await signInWithEmailAndPassword(auth, email, password);
                        showToast('Selamat datang kembali di galaksi! 🌌');
                    } else {
                        await createUserWithEmailAndPassword(auth, email, password);
                        showToast('Akun kosmik berhasil dibuat! ✨');
                    }
                } catch (err) {
                    showToast('Autentikasi Gagal: ' + (err.message || 'Periksa kembali data Anda'));
                } finally {
                    isAuthenticating = false;
                }
            },
            async handleLogout() {
                try {
                    if (unsubscribeTx) unsubscribeTx();
                    await signOut(auth);
                    showToast('Berhasil keluar orbit.');
                } catch (err) {
                    showToast('Gagal keluar.');
                }
            },
            async handleAddTx(e) {
                e.preventDefault();
                if (!currentUser) return;

                const title = document.getElementById('tx-title').value;
                const amount = parseFloat(document.getElementById('tx-amount').value);
                const category = document.getElementById('tx-category').value;
                const dateInput = document.getElementById('tx-date').value;

                let icon = '🌌';
                if (category === 'Food') icon = '🍔';
                else if (category === 'Transport') icon = '🚀';
                else if (category === 'Shopping') icon = '🛍️';
                else if (category === 'Entertainment') icon = '🍿';
                else if (category === 'Salary') icon = '💰';
                else if (category === 'Freelance') icon = '💻';
                else if (category === 'Investment') icon = '📈';

                const newTx = {
                    title,
                    category,
                    type: currentTxType,
                    amount,
                    date: dateInput || new Date().toISOString().split('T')[0],
                    icon,
                    createdAt: Date.now()
                };

                try {
                    const colRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions');
                    await addDoc(colRef, newTx);
                    window.appState.closeModal();
                    showToast('Transaksi tercatat di bintang-bintang! ✨');
                    document.getElementById('tx-form').reset();
                    document.getElementById('tx-date').valueAsDate = new Date();
                } catch (err) {
                    showToast('Gagal menyimpan transaksi.');
                }
            },
            async deleteTx(id) {
                if (!currentUser) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions', id));
                    showToast('Transaksi dihapus.');
                } catch (err) {
                    showToast('Gagal menghapus transaksi.');
                }
            }
        };

        // Initialize Authentication & Custom Token Handler
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.log("Auth fallback active:", e);
            }

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    setupTransactionsListener(user.uid);
                } else {
                    if (unsubscribeTx) unsubscribeTx();
                    transactions = [];
                }
                renderRoot();
            });
        }

        function setupTransactionsListener(uid) {
            if (unsubscribeTx) unsubscribeTx();
            const colRef = collection(db, 'artifacts', appId, 'users', uid, 'transactions');
            unsubscribeTx = onSnapshot(colRef, (snapshot) => {
                transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                transactions.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                if (currentUser && currentTab) {
                    renderMainAppContent();
                }
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        function renderRoot() {
            const root = document.getElementById('root-view');
            if (!root) return;

            if (!currentUser || currentUser.isAnonymous) {
                root.innerHTML = getAuthHTML();
            } else {
                root.innerHTML = getMainAppShellHTML();
                renderMainAppContent();
            }
            lucide.createIcons();
        }

        function getAuthHTML() {
            return `
                <div class="flex-1 flex flex-col justify-center px-6 py-10 relative z-20 animate-fadeIn">
                    <div class="text-center mb-8">
                        <div class="w-20 h-20 bg-gradient-to-tr from-purple-600 via-fuchsia-600 to-cyan-400 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-2xl neon-glow-purple mb-4 border border-purple-400/40 animate-float">
                            🌌
                        </div>
                        <h1 class="text-2xl font-bold text-white tracking-wide">CosmicWallet</h1>
                        <p class="text-xs text-purple-300/70 mt-1">Kelola Keuangan Pribadi Lintas Galaksi (Rupiah)</p>
                    </div>

                    <div class="glass-card p-6 rounded-3xl space-y-5 border border-purple-500/30">
                        <div class="grid grid-cols-2 gap-2 p-1 bg-purple-950/60 rounded-2xl border border-purple-500/20">
                            <button onclick="window.appState.setAuthMode('login')" class="py-2.5 rounded-xl font-semibold text-xs transition-all ${authMode === 'login' ? 'bg-gradient-to-r from-purple-600 to-cyan-600 text-white shadow-lg' : 'text-purple-300/60 hover:text-white'}">Masuk</button>
                            <button onclick="window.appState.setAuthMode('signup')" class="py-2.5 rounded-xl font-semibold text-xs transition-all ${authMode === 'signup' ? 'bg-gradient-to-r from-purple-600 to-cyan-600 text-white shadow-lg' : 'text-purple-300/60 hover:text-white'}">Daftar</button>
                        </div>

                        <form onsubmit="window.appState.handleAuth(event)" class="space-y-4">
                            <div>
                                <label class="block text-[11px] font-semibold text-purple-300/80 mb-1 uppercase tracking-wider">Email Kosmonot</label>
                                <input type="email" id="auth-email" required placeholder="kosmonot@galaxy.id" class="w-full px-4 py-3 bg-purple-950/40 border border-purple-500/30 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 text-white placeholder-purple-400/30">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-purple-300/80 mb-1 uppercase tracking-wider">Kata Sandi</label>
                                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-purple-950/40 border border-purple-500/30 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 text-white placeholder-purple-400/30">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-cyan-500 hover:opacity-90 text-white font-bold rounded-2xl shadow-lg neon-glow-cyan transition-all flex items-center justify-center space-x-2 text-sm cursor-pointer">
                                <span>${authMode === 'login' ? 'Masuk ke Orbit 🚀' : 'Aktifkan Akun Kosmik ✨'}</span>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function getMainAppShellHTML() {
            return `
                <div id="app-content" class="flex-1 overflow-y-auto no-scrollbar pb-28 relative z-20"></div>

                <!-- Bottom Navigation Bar -->
                <div class="absolute bottom-0 left-0 right-0 h-20 glass-nav flex items-center justify-around px-2 z-40">
                    <button onclick="window.appState.switchTab('home')" class="flex flex-col items-center justify-center w-12 h-12 ${currentTab === 'home' ? 'text-cyan-400' : 'text-purple-300/50 hover:text-purple-200'} transition-all">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium mt-1">Beranda</span>
                    </button>
                    <button onclick="window.appState.switchTab('transactions')" class="flex flex-col items-center justify-center w-12 h-12 ${currentTab === 'transactions' ? 'text-cyan-400' : 'text-purple-300/50 hover:text-purple-200'} transition-all">
                        <i data-lucide="receipt" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium mt-1">Catatan</span>
                    </button>
                    
                    <!-- Floating Add Button (+) -->
                    <button onclick="window.appState.openModal()" class="w-13 h-13 w-12 h-12 bg-gradient-to-tr from-purple-600 via-pink-600 to-cyan-400 rounded-full flex items-center justify-center text-white shadow-xl neon-glow-pink transform hover:scale-105 active:scale-95 transition-all -mt-5 border border-cyan-300/40 cursor-pointer">
                        <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
                    </button>

                    <button onclick="window.appState.switchTab('stats')" class="flex flex-col items-center justify-center w-12 h-12 ${currentTab === 'stats' ? 'text-cyan-400' : 'text-purple-300/50 hover:text-purple-200'} transition-all">
                        <i data-lucide="pie-chart" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium mt-1">Statistik</span>
                    </button>
                    <button onclick="window.appState.switchTab('profile')" class="flex flex-col items-center justify-center w-12 h-12 ${currentTab === 'profile' ? 'text-cyan-400' : 'text-purple-300/50 hover:text-purple-200'} transition-all">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span class="text-[10px] font-medium mt-1">Profil</span>
                    </button>
                </div>

                <!-- Add Transaction Modal -->
                <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
                    <div class="w-full sm:max-w-md bg-[#100720] border border-purple-500/30 rounded-t-[36px] sm:rounded-[36px] p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 max-h-[92vh] overflow-y-auto">
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex items-center space-x-2">
                                <span class="text-2xl">🪐</span>
                                <h3 class="text-lg font-bold text-white">Tambah Catatan Keuangan</h3>
                            </div>
                            <button onclick="window.appState.closeModal()" class="w-8 h-8 rounded-full bg-purple-950/60 border border-purple-500/30 flex items-center justify-center text-purple-300 hover:bg-purple-900 cursor-pointer">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <form id="tx-form" onsubmit="window.appState.handleAddTx(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-3 p-1 bg-purple-950/60 rounded-2xl border border-purple-500/20">
                                <button type="button" onclick="window.appState.setTxType('expense')" id="type-expense" class="py-2.5 rounded-xl font-semibold text-sm transition-all bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg text-center cursor-pointer">Pengeluaran (-)</button>
                                <button type="button" onclick="window.appState.setTxType('income')" id="type-income" class="py-2.5 rounded-xl font-semibold text-sm transition-all text-purple-300/60 hover:text-white text-center cursor-pointer">Pemasukan (+)</button>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-purple-300/80 mb-1.5 uppercase tracking-wider">Keterangan / Merchant</label>
                                <input type="text" id="tx-title" required placeholder="cth. Kopi Nebula, Gaji Bulanan" class="w-full px-4 py-3 bg-purple-950/40 border border-purple-500/30 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 text-white placeholder-purple-400/30">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-purple-300/80 mb-1.5 uppercase tracking-wider">Jumlah (Rupiah / Rp)</label>
                                <input type="number" id="tx-amount" required min="1000" placeholder="50000" class="w-full px-4 py-3 bg-purple-950/40 border border-purple-500/30 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 text-white placeholder-purple-400/30">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-purple-300/80 mb-1.5 uppercase tracking-wider">Kategori</label>
                                <select id="tx-category" class="w-full px-4 py-3 bg-[#150a28] border border-purple-500/30 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 text-white">
                                    <option value="Food">🍔 Makanan & Minuman</option>
                                    <option value="Transport">🚀 Transportasi</option>
                                    <option value="Shopping">🛍️ Belanja</option>
                                    <option value="Entertainment">🍿 Hiburan</option>
                                    <option value="Salary">💰 Gaji Utama</option>
                                    <option value="Freelance">💻 Proyek / Freelance</option>
                                    <option value="Investment">📈 Investasi</option>
                                    <option value="Others">🌌 Lainnya</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-purple-300/80 mb-1.5 uppercase tracking-wider">Tanggal</label>
                                <input type="date" id="tx-date" required class="w-full px-4 py-3 bg-purple-950/40 border border-purple-500/30 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400 text-white">
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 via-fuchsia-600 to-cyan-500 hover:opacity-90 text-white font-bold rounded-2xl shadow-xl neon-glow-cyan transition-all mt-4 flex items-center justify-center space-x-2 cursor-pointer">
                                <span>Simpan Transaksi</span>
                                <span>✨</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- PWA Installation Guide Modal -->
                <div id="pwa-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-5 opacity-0 pointer-events-none transition-opacity duration-300">
                    <div class="w-full max-w-sm bg-[#100720] border border-cyan-500/40 rounded-[32px] p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-white flex items-center space-x-2">
                                <span>📱</span>
                                <span>Instal CosmicWallet (PWA)</span>
                            </h3>
                            <button onclick="window.appState.closePwaModal()" class="w-8 h-8 rounded-full bg-purple-950/60 border border-purple-500/30 flex items-center justify-center text-purple-300 hover:bg-purple-900 cursor-pointer">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>

        function renderMainAppContent() {
            const container = document.getElementById('app-content');
            if (!container) return;

            if (currentTab === 'home') {
                container.innerHTML = getHomeHTML();
            } else if (currentTab === 'transactions') {
                container.innerHTML = getTransactionsHTML();
            } else if (currentTab === 'stats') {
                container.innerHTML = getStatsHTML();
            } else if (currentTab === 'profile') {
                container.innerHTML = getProfileHTML();
            }
            lucide.createIcons();

            const dateInput = document.getElementById('tx-date');
            if (dateInput && !dateInput.value) {
                dateInput.valueAsDate = new Date();
            }
        }

        function getTotalExpenses() {
            return transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
        }

        function getTotalIncome() {
            return transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3500);
        }

        // Live Clock Simulation
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const clockEl = document.getElementById('current-time');
            if (clockEl) clockEl.innerText = timeStr;
        }, 1000);

        initApp();
